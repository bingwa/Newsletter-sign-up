<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Sign up for our newsletter">
  <meta name="author" content="">
  <title>The Gospel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="public/css/styles.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="container">
    <form action="/.netlify/functions/subscribe" method="POST" class="form-signup mx-auto" id="signupForm" style="max-width: 400px;">
      <div class="text-center mb-4">
        <img class="mb-4" src="public/image/Bold and Modern M Letter.png" alt="Logo" width="72" height="72">
        <h1 class="h3 mb-3 fw-normal">Sign Up for Newsletter</h1>
      </div>

      <div class="mb-3">
        <label for="inputName" class="form-label">Full Name</label>
        <input type="text" name="Fullname" id="inputName" class="form-control" placeholder="Enter your name" required>
      </div>

      <div class="mb-3">
        <label for="inputEmail" class="form-label">Email Address</label>
        <input type="email" name="email" id="inputEmail" class="form-control" placeholder="Enter your email" required>
      </div>

      <div class="mb-3">
        <label for="inputPassword" class="form-label">Password</label>
        <input type="password" name="password" id="inputPassword" class="form-control" placeholder="Create a password" required>
      </div>

      <div class="mb-3">
        <label for="inputConfirmPassword" class="form-label">Confirm Password</label>
        <input type="password" name="confirmPassword" id="inputConfirmPassword" class="form-control" placeholder="Confirm your password" required>
      </div>

      <div id="errorMessage" class="text-danger text-center mb-3" style="display: none;"></div>

      <button class="btn btn-primary w-100 py-2" type="submit">Sign Up</button>

      <p class="mt-4 text-center text-muted">
        Already have an account? <a href="login.html" class="text-primary text-decoration-none">Log in</a>
      </p>
      <p class="mt-3 text-center text-muted">&copy; The Gospel</p>
    </form>
  </div>

  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.style.display = 'none';
      errorMessage.textContent = '';

      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);

      // Client-side validation
      if (!data.Fullname.trim()) {
        errorMessage.textContent = 'Full name is required.';
        errorMessage.style.display = 'block';
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(data.email)) {
        errorMessage.textContent = 'Please enter a valid email address.';
        errorMessage.style.display = 'block';
        return;
      }

      if (data.password !== data.confirmPassword) {
        errorMessage.textContent = 'Passwords do not match.';
        errorMessage.style.display = 'block';
        return;
      }

      if (data.password.length < 6) {
        errorMessage.textContent = 'Password must be at least 6 characters long.';
        errorMessage.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('/.netlify/functions/subscribe', {
          method: 'POST',
          body: JSON.stringify(data),
          headers: { 'Content-Type': 'application/json' }
        });
        const result = await response.json();
        if (response.ok && result.redirect === '/success.html') {
          window.location.href = '/success.html';
        } else {
          errorMessage.textContent = result.error || 'Subscription failed. Please try again.';
          errorMessage.style.display = 'block';
          setTimeout(() => { window.location.href = '/failure.html'; }, 2000);
        }
      } catch (error) {
        errorMessage.textContent = 'An error occurred. Please try again.';
        errorMessage.style.display = 'block';
        setTimeout(() => { window.location.href = '/failure.html'; }, 2000);
      }
    });
  </script>
</body>
</html>
